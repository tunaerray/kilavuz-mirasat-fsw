name: CI

# KILAVUZ MİRASAT FSW — her push ve PR'da testleri ve statik analizi koşar.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static analysis (pyflakes)
        run: python -m pyflakes src config tests

      - name: Run test suite (pytest, deterministic)
        run: python -m pytest --timeout=30 -q
